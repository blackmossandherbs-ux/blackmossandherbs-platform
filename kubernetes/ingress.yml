apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blackmoss-ingress
  namespace: blackmoss-production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
spec:
  tls:
  - hosts:
    - blackmossandherbs.com
    - www.blackmossandherbs.com
    secretName: blackmoss-tls
  rules:
  - host: blackmossandherbs.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: blackmoss-web-service
            port:
              number: 80
  - host: www.blackmossandherbs.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: blackmoss-web-service
            port:
              number: 80
