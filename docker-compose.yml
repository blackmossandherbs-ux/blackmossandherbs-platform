version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: blackmoss_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blackmoss_herbs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blackmoss_network

  redis:
    image: redis:7-alpine
    container_name: blackmoss_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blackmoss_network

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: blackmoss_meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-masterKey123}
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blackmoss_network

  ollama:
    image: ollama/ollama:latest
    container_name: blackmoss_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - blackmoss_network
    # Optional: Uncomment to pull models on startup
    # command: >
    #   sh -c "ollama pull llama3 && ollama serve"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blackmoss_web
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blackmoss_herbs?schema=public
      REDIS_URL: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-masterKey123}
      OLLAMA_BASE_URL: http://ollama:11434
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-in-production}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/.next
    networks:
      - blackmoss_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: blackmoss_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - blackmoss_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  ollama_data:

networks:
  blackmoss_network:
    driver: bridge
