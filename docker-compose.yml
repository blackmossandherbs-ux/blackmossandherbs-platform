version: '3.8'

# BLACK MOSS & HERBS - PRODUCTION DEPLOYMENT
# Unique names prevent conflicts with other projects on the same server

services:
  # PostgreSQL Database
  blackmossherbs-db:
    image: postgres:15-alpine
    container_name: blackmossherbs-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-blackmoss_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_blackmoss_2024}
      POSTGRES_DB: ${DB_NAME:-blackmossherbs}
    volumes:
      - blackmossherbs-db-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"  # Unique external port
    networks:
      - blackmossherbs-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-blackmoss_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  blackmossherbs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blackmossherbs-app
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-blackmoss_user}:${DB_PASSWORD:-changeme_blackmoss_2024}@blackmossherbs-db:5432/${DB_NAME:-blackmossherbs}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - PORT=3000
    ports:
      - "3005:3000"  # Unique external port 3005 for Black Moss
    depends_on:
      blackmossherbs-db:
        condition: service_healthy
    networks:
      - blackmossherbs-net
    volumes:
      - ./prisma:/app/prisma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  blackmossherbs-db-data:
    driver: local

networks:
  blackmossherbs-net:
    driver: bridge
    name: blackmossherbs-network
