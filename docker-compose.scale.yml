version: "3.8"

# Production-scale Docker Compose configuration
# For horizontal scaling and high availability

services:
  # Load Balancer (Nginx)
  nginx-lb:
    image: nginx:alpine
    container_name: blackmoss_nginx_lb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-lb.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web-1
      - web-2
    networks:
      - blackmoss_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Web Application (Multiple Instances)
  web-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blackmoss_web_1
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blackmoss_herbs?schema=public&pgbouncer=true
      REDIS_URL: redis://redis:6379
      REDIS_SESSION_URL: redis://redis:6379/1
      MEILISEARCH_HOST: http://meilisearch:7700
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NODE_ENV: production
      INSTANCE_ID: web-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blackmoss_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blackmoss_web_2
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blackmoss_herbs?schema=public&pgbouncer=true
      REDIS_URL: redis://redis:6379
      REDIS_SESSION_URL: redis://redis:6379/1
      MEILISEARCH_HOST: http://meilisearch:7700
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NODE_ENV: production
      INSTANCE_ID: web-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blackmoss_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Database with Connection Pooling
  postgres:
    image: postgres:16-alpine
    container_name: blackmoss_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blackmoss_herbs
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blackmoss_network
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"

  # PgBouncer - Connection Pooler
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: blackmoss_pgbouncer
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_USER: postgres
      DATABASES_PASSWORD: postgres
      DATABASES_DBNAME: blackmoss_herbs
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
      PGBOUNCER_MIN_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_TIMEOUT: 3
      PGBOUNCER_MAX_DB_CONNECTIONS: 100
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blackmoss_network
    healthcheck:
      test: ["CMD", "psql", "-h", "localhost", "-U", "postgres", "-d", "pgbouncer", "-c", "SHOW POOLS"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis - Sessions & Cache
  redis:
    image: redis:7-alpine
    container_name: blackmoss_redis
    command:
      - redis-server
      - --maxmemory 512mb
      - --maxmemory-policy allkeys-lru
      - --save 60 1000
      - --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blackmoss_network

  # Redis Sentinel (for HA)
  redis-sentinel:
    image: redis:7-alpine
    container_name: blackmoss_redis_sentinel
    command:
      - redis-sentinel
      - /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis
    networks:
      - blackmoss_network

  # Meilisearch
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: blackmoss_meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-masterKey123}
      MEILI_ENV: production
      MEILI_DB_PATH: /meili_data
      MEILI_HTTP_ADDR: 0.0.0.0:7700
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blackmoss_network

  # Background Job Queue (Bull)
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: blackmoss_queue_worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blackmoss_herbs?schema=public&pgbouncer=true
      REDIS_URL: redis://redis:6379
      REDIS_QUEUE_URL: redis://redis:6379/2
      NODE_ENV: production
    depends_on:
      - redis
      - postgres
    networks:
      - blackmoss_network
    restart: unless-stopped
    command: ["node", "packages/queue/dist/worker.js"]

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: blackmoss_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - blackmoss_network

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: blackmoss_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - blackmoss_network

  # Log Aggregation - Loki
  loki:
    image: grafana/loki:latest
    container_name: blackmoss_loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - blackmoss_network

  # Log Collector - Promtail
  promtail:
    image: grafana/promtail:latest
    container_name: blackmoss_promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - blackmoss_network

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  blackmoss_network:
    driver: bridge
