name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Validate environment template
        run: |
          cp .env.example .env
          node scripts/validate-env.js || true
      
      - name: Type check
        run: npm run type-check || npx tsc --noEmit || true
      
      - name: Lint
        run: npm run lint || true
      
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/test
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-minimum-32-characters-long
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_example
          STRIPE_SECRET_KEY: sk_test_example
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: blackmossherbs:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker run --rm blackmossherbs:${{ github.sha }} node -v

