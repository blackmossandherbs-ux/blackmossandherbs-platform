# BLACK MOSS & HERBS - NGINX CONFIGURATION
# This project runs on PORT 3005 (isolate from other projects)
# Domain: blackmossandherbs.com

server {
    server_name blackmossandherbs.com www.blackmossandherbs.com;

    # Buffer sizes for Next.js
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    client_max_body_size 50M;

    location / {
        # Route to Black Moss on PORT 3005
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files optimization
    location /_next/static {
        proxy_pass http://127.0.0.1:3005;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=3600";
    }

    # HTTP (port 80) - Certbot will add HTTPS config
    listen 80;
}

# Redirect alternate domains to main
server {
    server_name blackmossandherbs.co.uk www.blackmossandherbs.co.uk;
    return 301 https://blackmossandherbs.com$request_uri;
    listen 80;
}

server {
    server_name blackmossandherbs.info www.blackmossandherbs.info;
    return 301 https://blackmossandherbs.com$request_uri;
    listen 80;
}
