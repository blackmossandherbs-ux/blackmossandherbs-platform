# Black Moss & Herbs - Nginx Configuration
# Port: 3005 (unique to this site to avoid conflicts with other projects)
#
# Installation:
#   1. Copy this file to /etc/nginx/sites-available/blackmoss.conf
#   2. Create symlink: ln -sf /etc/nginx/sites-available/blackmoss.conf /etc/nginx/sites-enabled/
#   3. Test: nginx -t
#   4. Reload: systemctl reload nginx
#   5. SSL: certbot --nginx -d blackmossandherbs.com -d www.blackmossandherbs.com

# Main site - blackmossandherbs.com
server {
    listen 80;
    listen [::]:80;
    server_name blackmossandherbs.com www.blackmossandherbs.com;

    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Proxy to Next.js app on port 3005
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static file caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# Redirects for .co.uk
server {
    listen 80;
    listen [::]:80;
    server_name blackmossandherbs.co.uk www.blackmossandherbs.co.uk;
    return 301 https://blackmossandherbs.com$request_uri;
}

# Redirects for .info
server {
    listen 80;
    listen [::]:80;
    server_name blackmossandherbs.info www.blackmossandherbs.info;
    return 301 https://blackmossandherbs.com$request_uri;
}
