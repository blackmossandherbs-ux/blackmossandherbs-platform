##
# Black Moss & Herbs - Nginx site config (multi-site safe)
#
# This file is intended to be placed at:
#   /etc/nginx/sites-available/blackmossandherbs
# and symlinked into:
#   /etc/nginx/sites-enabled/
#
# Notes:
# - Docker deployment maps host port 3005 -> container 3000 (see docker-compose.yml)
# - PM2 deployment usually listens on 3000 (adjust proxy_pass if you use PM2)
##

# HTTP -> HTTPS for the primary domain
server {
    listen 80;
    server_name blackmossandherbs.com www.blackmossandherbs.com;
    return 301 https://blackmossandherbs.com$request_uri;
}

# HTTPS for the primary domain
server {
    listen 443 ssl http2;
    server_name blackmossandherbs.com www.blackmossandherbs.com;

    # Let's Encrypt certificates (created by certbot)
    ssl_certificate /etc/letsencrypt/live/blackmossandherbs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blackmossandherbs.com/privkey.pem;

    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Basic security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# Redirects for .co.uk (HTTP only, unless you also provision SSL for these domains)
server {
    listen 80;
    server_name blackmossandherbs.co.uk www.blackmossandherbs.co.uk;
    return 301 https://blackmossandherbs.com$request_uri;
}

# Redirects for .info (HTTP only, unless you also provision SSL for these domains)
server {
    listen 80;
    server_name blackmossandherbs.info www.blackmossandherbs.info;
    return 301 https://blackmossandherbs.com$request_uri;
}
